# Every pull request and every push to main runs lint, typecheck, and the test
# suite on Linux and macOS, then a --version smoke test against the compiled
# host binary through both channels. The `ci` job at the end is the one
# required check on main; it fails when any job before it did.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test

      - name: Compile the host binary
        run: |
          target="$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m | sed 's/x86_64/x64/; s/aarch64/arm64/')"
          echo "TARGET=$target" >> "$GITHUB_ENV"
          bun run scripts/build.ts --compile --target="$target"

      # Both channels answer --version with the stub's line on stdout and the
      # package version on stderr. The launcher finds its binary through the
      # staged platform package, linked where npm would have put it.
      - name: Smoke test --version against a stub claude
        run: |
          stub="$RUNNER_TEMP/claude"
          printf '#!/bin/sh\necho "2.1.259 (Claude Code)"\n' > "$stub"
          chmod +x "$stub"
          export MCLAUDE_CLAUDE_PATH="$stub"
          export MCLAUDE_HOME="$RUNNER_TEMP/mclaude-home"
          version="$(bun -p 'require("./package.json").version')"
          ln -s "$PWD/npm/multi-claude-$TARGET" "node_modules/multi-claude-$TARGET"
          for exe in bin/mclaude "out/mclaude-$TARGET"; do
            out="$("$exe" --version 2> "$RUNNER_TEMP/err")"
            err="$(cat "$RUNNER_TEMP/err")"
            echo "$exe: stdout=[$out] stderr=[$err]"
            [ "$out" = "2.1.259 (Claude Code)" ] || { echo "stdout mismatch"; exit 1; }
            case "$err" in *"$version"*) ;; *) echo "stderr lacks $version"; exit 1 ;; esac
          done

      - name: The launcher without its platform package exits 69
        run: |
          rm "node_modules/multi-claude-$TARGET"
          if bin/mclaude --version; then echo "expected a failure"; exit 1; fi
          [ "$(bin/mclaude --version 2>/dev/null; echo $?)" = 69 ]

  # One name for the branch ruleset to require. `if: always()` keeps it running
  # when a dependency failed or was cancelled, so it can turn red instead of
  # being skipped, which GitHub would count as passing.
  ci:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
